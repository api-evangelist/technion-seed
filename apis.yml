name: Technion Seed
description: Technion Seed is an early-stage Israeli technology incubator and seed
  investment vehicle jointly owned by four venture capital funds — Vertex Ventures
  Israel, Battery Ventures, SCP-Vitalife and ProSeed — together with the Technion
  Research & Development Foundation. Through Technion Seed these funds invest up to
  roughly $1,000,000 in high-market-potential, early-stage technological ideas and
  ventures emerging from and around the Technion, helping entrepreneurs prove the
  viability of their idea at a stage of very high uncertainty. It is an investment
  firm and incubator rather than an API producer, and publishes no developer portal,
  documentation, or public API surface.
